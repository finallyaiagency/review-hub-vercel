name: Legacy Review Hub production publishing disabled

on:
  workflow_dispatch:

permissions: {}

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the Next.js production boundary
        run: |
          echo "This legacy static repository is forbidden from deploying to review-hub-vercel production."
          echo "Use the dedicated Next.js dashboard source for production releases."
          exit 1
